<!DOCTYPE html>
<html>
<head>
    <title>Accounting Theme Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #0f172a;
            color: #10b981;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #10b981;
        }
        .toggle-label {
            font-size: 18px;
            font-weight: 500;
        }
        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: #334155;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch.active {
            background: #10b981;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-switch.active::after {
            transform: translateX(30px);
        }
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accounting Theme Options</h1>
        
        <div class="toggle" id="ledgerToggle">
            <span class="toggle-label">Enable Ledger Theme</span>
            <div class="toggle-switch" id="toggleSwitch"></div>
        </div>
        
        <div class="status" id="status">
            <p>Theme is currently <span id="statusText">disabled</span></p>
        </div>
    </div>
    
    <script>
        // Load current state
        chrome.storage.sync.get('ledgerEnabled', (result) => {
            const isEnabled = result.ledgerEnabled || false;
            updateUI(isEnabled);
        });
        
        // Update UI based on state
        function updateUI(isEnabled) {
            const toggleSwitch = document.getElementById('toggleSwitch');
            const statusText = document.getElementById('statusText');
            
            if (isEnabled) {
                toggleSwitch.classList.add('active');
                statusText.textContent = 'enabled';
            } else {
                toggleSwitch.classList.remove('active');
                statusText.textContent = 'disabled';
            }
        }
        
        // Toggle functionality
        document.getElementById('ledgerToggle').addEventListener('click', () => {
            chrome.storage.sync.get('ledgerEnabled', (result) => {
                const currentState = result.ledgerEnabled || false;
                const newState = !currentState;
                
                chrome.storage.sync.set({ ledgerEnabled: newState }, () => {
                    updateUI(newState);
                    console.log('Ledger theme ' + (newState ? 'enabled' : 'disabled'));
                });
            });
        });
        
        // Also toggle when clicking the switch directly
        document.getElementById('toggleSwitch').addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
